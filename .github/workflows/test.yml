name: Test OpenCode Harness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CORE_REF: 5cfff76cc474d503ffd816e12af1a43e9d2e446a
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile --registry https://registry.npmjs.org
      - run: bun run typecheck
      - run: bun run test
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: python:core/shared/lib
