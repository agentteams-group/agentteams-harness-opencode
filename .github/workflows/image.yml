name: Build OpenCode candidate image
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CORE_REF: 7a0d2aa7f01f35565bd0205c72562eb7c986182d
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: ${{ env.CORE_REF }}
          path: core
      - run: git -C core submodule update --init deepseek-harness
      - uses: docker/setup-buildx-action@v3
      - run: make -C core build-agentteams-controller LOCAL_CONTROLLER=agentteams/controller:opencode
      - run: >-
          docker build --platform '${{ matrix.platform }}' --build-context at=./core
          --build-arg AGENTTEAMS_CONTROLLER_IMAGE=agentteams/controller:opencode
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t agentteams/opencode:candidate .
      - run: docker run --rm --entrypoint python3 agentteams/opencode:candidate -c 'import agentteams_opencode.bridge'
      - run: >-
          docker run --rm --network none --env AGENTTEAMS_OTEL_ENABLED=false
          --env XDG_DATA_HOME=/tmp/at-search-fresh --entrypoint bun
          -v "$PWD/tests/image-search-smoke.ts:/opt/agentteams/opencode/tests/image-search-smoke.ts:ro"
          agentteams/opencode:candidate /opt/agentteams/opencode/tests/image-search-smoke.ts
      - run: >-
          docker run --rm --entrypoint bun agentteams/opencode:candidate
          -e 'import { OpenCode } from "@opencode/sdk";
          const host=await OpenCode.create({database:{path:":memory:"},models:{fetch:false},config:{project:false,content:"{}"}});
          await host.close();'
