[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentteams-harness-opencode"
version = "0.1.0"
description = "OpenCode native Harness for AgentTeams Worker and Leader roles"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
agentteams-opencode = "agentteams_opencode.bridge:main"

[tool.setuptools.packages.find]
where = ["python"]
